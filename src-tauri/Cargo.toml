[package]
name = "agent-studio"
version = "0.2.0"
description = "A local workspace for your AI agents"
authors = ["Vinicius Portela <vinicius.portela.stm@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agent_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
toml = "0.9"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
tempfile = "3"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
notify-rust = { version = "4.18.0", features = ["preview-macos-un"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "wav"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7.3"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Credentials", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Com", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.55"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
