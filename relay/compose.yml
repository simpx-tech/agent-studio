services:
  relay:
    build:
      context: ..
      dockerfile: relay/Dockerfile
    restart: unless-stopped
    environment:
      AGENT_STUDIO_RELAY_TOKEN: ${AGENT_STUDIO_RELAY_TOKEN:?Set a private pairing key of at least 32 characters}
    ports:
      - "127.0.0.1:4317:4317"
    volumes:
      - relay-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  relay-data:
